<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#SALON01</title>
<link rel="icon" type="image/png" href="favicon1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 7vw;
            background: #0000aa;
            color: #ffffff;
            font-family: "VT323", "Courier New", monospace;
            font-size: 24px;
            line-height: 1.3;
        }

        main {
            max-width: 850px;
            margin: 0 auto;
        }

        h1 {
            font-family: "VT323", "Courier New", monospace;
            font-size: 52px;
            font-weight: normal;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        .ashby {
            margin: 40px 0;
        }

        .quote {
            font-family: "IBM Plex Mono", Consolas, monospace;
            font-size: 17px;
            line-height: 1.5;
            max-width: 600px;
            margin: 0 0 20px 20px;
            letter-spacing: -0.2px;
        }

        .source {
            font-family: "VT323", "Courier New", monospace;
            font-size: 18px;
            color: #cccccc;
            margin-left: 20px;
        }

        .description {
            border-top: 2px solid #ffffff;
            padding-top: 25px;
            max-width: 700px;
            margin-bottom: 25px;
        }

        .description p {
            margin: 0 0 25px 0;
        }

        .past-salons {
            border-top: 2px solid #ffffff;
            padding-top: 25px;
            max-width: 700px;
        }

        .past-salons-title {
            font-family: "IBM Plex Mono", Consolas, monospace;
            font-size: 15px;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
        }

        .archive {
            font-family: "IBM Plex Mono", Consolas, monospace;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: #bbbbbb;
            margin-bottom: 20px;
        }

        a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        a:hover, a:focus {
            background-color: #ffffff;
            color: #0000aa;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 20px;
            }

            h1 {
                font-size: 38px;
            }

            .quote, .source {
                margin-left: 0;
            }

            .quote {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<main>

    <h1>#SALON01</h1>


    <section class="description">
        <p>
        a 2 day inaugral event featuring ticketed workshops and and free to attend presentations
        by homegrown talent. stay tuned for the lineup announcement and registration.
        <br>
        <br>
        LOCATION: SAMAGATA FOUNDATION, MG ROAD<br>
        DATES: 3RD, 4TH OCT, 2026<br>
        TIME: 10 AM TO 5:00 PM<br>
        <p/>

    </section>

    <section class="past-salons">

        <div class="archive">
            <a href='possiblemachines.github.io'>back to main</a>
        </div>

    </section>

</main>

</body>
</html>
