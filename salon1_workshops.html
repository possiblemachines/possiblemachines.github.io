<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>#salon01_workshops</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 7vw;
            background: #0000aa;
            color: #ffffff;
            font-family: "VT323", "Courier New", monospace;
            font-size: 24px;
            line-height: 1.3;
        }

        main {
            max-width: 850px;
            margin: 0 auto;
        }

        h1 {
            font-family: "VT323", "Courier New", monospace;
            font-size: 52px;
            font-weight: normal;
            margin: 0 0 40px 0;
            letter-spacing: 1px;
        }

        .workshop {
            max-width: 700px;
        }

        .workshop-title {
            font-family: "IBM Plex Mono", Consolas, monospace;
            font-size: 15px;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .workshop-image {
            border: 2px solid #ffffff;
            display: inline-block;
            margin-bottom: 30px;
        }

        .workshop-image img {
            display: block;
            max-width: 100%;
            width: auto;
            height: auto;
        }

        .link {
            font-family: "IBM Plex Mono", Consolas, monospace;
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        a {
            color: #ffffff;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        a:hover, a:focus {
            background-color: #ffffff;
            color: #0000aa;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 20px;
            }

            h1 {
                font-size: 38px;
            }

            .link {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<main>

    <h1>#salon01_workshops</h1>

    <section class="workshop">

        <div class="workshop-title">
            WORKSHOP 1
        </div>

        <div class="workshop-image">
            <img src="vineeshworkshop(1).png" alt="Workshop 1">
        </div>

        <div class="link">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSdBXGFHn9HY3q4R870YvnDIO4RDTKp6x-H5imX5vfbsvTpTQw/viewform" target="_blank">
                [REGISTER_FOR_DIY_SYNTH_WORKSHOP]
            </a><br><br>
            <a href='possiblemachines.github.io'>back to main</a>
        </div>
        <div class="archive">
            
        </div>


    </section>

</main>

</body>
</html>
